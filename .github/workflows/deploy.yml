# Publishes this repo to Cloudflare Pages on every push to main.
#
# The app now links preflopapp.com (see PaywallLinks.swift). GitHub Pages
# still publishes the same commit at preflopapp.github.io as a continuity
# mirror — nothing in the app depends on that hostname anymore, but the
# copy is kept working. This workflow keeps the Cloudflare copy — the one
# preflopapp.com serves — from drifting behind it.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   scoped to Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check site
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/check-site.py .

      # Pages direct upload publishes every file in the deployed directory,
      # dotfiles included — deploying the repo root would put .github and
      # .gitignore on the public site. Copy the site into a clean directory
      # instead. Dot-entries are dropped (.git, .github, .gitignore,
      # .nojekyll mean nothing to Cloudflare), except .well-known: it holds
      # apple-app-site-association, which iOS must fetch for preflopapp.com/s/*
      # to open the app. A blanket --exclude='.*' dropped it, so it 404'd.
      # scripts/ is excluded because the checker is a build tool, not content,
      # and CLAUDE.md because it is notes for the repo, not a page.
      - name: Assemble deploy directory
        run: |
          mkdir -p _site
          rsync -a --include='.well-known/' --exclude='.*' --exclude='_site/' --exclude='scripts/' --exclude='CLAUDE.md' ./ _site/
          test -f _site/.well-known/apple-app-site-association
          find _site -type f | sort

      - name: Deploy to Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name preflopapp --branch main

      # Proves the deploy actually reached the edge, not just Cloudflare's
      # API, and that it's serving the NEW content — not just any 200.
      #
      # Fetched from preflopapp.pages.dev, not preflopapp.com: the zone's bot
      # protection answers GitHub's runner IPs with a 403 managed challenge
      # (`cf-mitigated: challenge`, confirmed 2026-09-19), even with a browser
      # user agent. pages.dev is the same Pages project and deployment, outside
      # the zone's security settings. If that protection is relaxed for
      # runners, point BASE back at the custom domain.
      # `curl --retry` only retries on HTTP-level failures, so it can't
      # catch a 200 that serves the previous deploy's page (old titles
      # contain "Preflop Trainer"). Edge propagation after the first
      # deploy can lag, so each URL gets its own retry loop that keeps
      # polling until the content check passes.
      - name: Smoke-test the live site
        run: |
          BASE=https://preflopapp.pages.dev
          status=0
          for path in $(grep -oE '<loc>https://preflopapp\.com[^<]*' sitemap.xml | sed 's/<loc>https:\/\/preflopapp\.com//'); do
            url="$BASE$path"
            ok=0
            for attempt in 1 2 3 4 5 6; do
              if curl -fsS --max-time 20 -o /tmp/page "$url" \
                 && grep -q "<title>" /tmp/page \
                 && ! grep -q "Preflop Trainer" /tmp/page; then
                echo "ok   $url (attempt $attempt)"
                ok=1
                break
              fi
              echo "retrying $url (attempt $attempt failed)"
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::$url failed after deploy"; status=1
            fi
          done
          # Not in the sitemap, and each broke once without any check noticing:
          # a shared hand's link (the /s/:id rewrite) and the Universal Links
          # file iOS reads to open those links in the app.
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 -o /tmp/page "$BASE/s/smoke-test?p=1" \
               && grep -q "<title>Your move?" /tmp/page \
               && curl -fsS --max-time 20 "$BASE/.well-known/apple-app-site-association" | grep -q '"applinks"'; then
              echo "ok   /s/:id and apple-app-site-association (attempt $attempt)"
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::/s/:id or apple-app-site-association failed after deploy"; status=1
            fi
            sleep 10
          done
          exit $status
